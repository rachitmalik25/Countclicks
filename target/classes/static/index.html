<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111827">
    <title>Countclicks | CI/CD Demo</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #0b1020;
            color: #f8fafc;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background: radial-gradient(ellipse at top, #202d52 0%, #0b1020 58%);
        }

        main {
            width: min(100%, 560px);
            padding: 48px 32px;
            text-align: center;
            background: rgb(17 24 39 / 88%);
            border: 1px solid #293653;
            border-radius: 24px;
            box-shadow: 0 24px 80px rgb(0 0 0 / 30%);
        }

        .badge {
            display: inline-block;
            padding: 7px 12px;
            color: #a5f3fc;
            background: #164e63;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        h1 { margin: 20px 0 8px; font-size: clamp(2rem, 8vw, 3rem); }
        p { color: #aab7ce; line-height: 1.6; }

        #count {
            margin: 28px 0;
            color: #67e8f9;
            font-size: clamp(4rem, 16vw, 6rem);
            font-variant-numeric: tabular-nums;
            font-weight: 800;
            line-height: 1;
        }

        button {
            min-width: 190px;
            padding: 14px 22px;
            color: #082f49;
            background: #67e8f9;
            border: 0;
            border-radius: 12px;
            cursor: pointer;
            font: inherit;
            font-weight: 800;
            transition: transform 120ms ease, background 120ms ease;
        }

        button:hover { background: #a5f3fc; transform: translateY(-2px); }
        button:focus-visible { outline: 3px solid white; outline-offset: 4px; }
        button:disabled { cursor: wait; opacity: 0.65; transform: none; }
        #message { min-height: 1.6em; font-size: 0.9rem; }
        footer { margin-top: 28px; color: #71809b; font-size: 0.8rem; }
    </style>
</head>
<body>
<main>
    <span class="badge">GitHub Actions CI/CD Demo</span>
    <h1>Countclicks</h1>
    <p>A tiny Java web app. Every click is counted by the Spring Boot API.</p>
    <div id="count" aria-live="polite" aria-label="Total clicks">0</div>
    <button id="click-button" type="button">Click me</button>
    <p id="message" role="status">Loading counter...</p>
    <footer>Built with Java 17 and Spring Boot</footer>
</main>
<script>
    const countElement = document.querySelector("#count");
    const button = document.querySelector("#click-button");
    const message = document.querySelector("#message");

    async function updateCount(method = "GET") {
        const response = await fetch("/api/clicks", { method });
        if (!response.ok) {
            throw new Error(`Counter request failed (${response.status})`);
        }
        const result = await response.json();
        countElement.textContent = result.count;
        message.textContent = "Counter is connected.";
    }

    updateCount().catch((error) => {
        message.textContent = error.message;
    });

    button.addEventListener("click", async () => {
        button.disabled = true;
        try {
            await updateCount("POST");
        } catch (error) {
            message.textContent = error.message;
        } finally {
            button.disabled = false;
        }
    });
</script>
</body>
</html>
